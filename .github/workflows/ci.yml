name: QubitLab CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Frontend: TypeScript Checking, Linting, Build, Unit Tests
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (TypeScript, Build, Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Production Vite Build
        run: npm run build
        env:
          VITE_API_URL: "https://api.qubitlab.dev/api/v1"
          VITE_WS_URL: "wss://api.qubitlab.dev"

      - name: Run Frontend Unit Tests
        run: |
          node backend/tests/test_quantum_ide.mjs
          node backend/tests/test_curriculum.mjs

  # ─────────────────────────────────────────────────────────────
  # Backend: Python Tests & Quantum Simulator Verification
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend (Pytest, Quantum Engines, API Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: development
          DEBUG: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          JWT_SECRET_KEY: "ci-test-secret-key-32-characters-min"
          AI_PROVIDER: ""
          AI_API_KEY: ""
        run: |
          pytest -v tests

  # ─────────────────────────────────────────────────────────────
  # Terraform: Formatting & Validation
  # ─────────────────────────────────────────────────────────────
  terraform-ci:
    name: Terraform (Format & Validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup OpenTofu / Terraform
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.2

      - name: Check Terraform Formatting
        run: tofu fmt -check -recursive terraform/

      - name: Initialize Root Module (No Backend)
        run: tofu -chdir=terraform init -backend=false

      - name: Validate Root Module
        run: tofu -chdir=terraform validate

  # ─────────────────────────────────────────────────────────────
  # Docker: Image Build Verification & Compose Validation
  # ─────────────────────────────────────────────────────────────
  docker-ci:
    name: Docker (Build Verification)
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: qubitlab-frontend:ci-test

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: qubitlab-backend:ci-test

  # ─────────────────────────────────────────────────────────────
  # Security: Secret Scanning & Vulnerability Audits
  # ─────────────────────────────────────────────────────────────
  security-ci:
    name: Security (Secrets & Dependency Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Committed Secrets & Keys
        run: |
          echo "Scanning for sensitive keys and credentials..."
          # Scan tracked code files for unmasked private keys or AWS access keys
          # Exclude .github workflows, docs, and example files to prevent self-matching
          if git grep -nE "BEGIN RSA PRIVATE KEY|BEGIN PRIVATE KEY|AKIA[0-9A-Z]{16}" -- ':!.github' ':!*.md' ':!*.example' ':!*.tfvars.example'; then
            echo "::error::Potential sensitive secret or private key found in tracked files!"
            exit 1
          fi
          echo "Secret scan passed."

      - name: Setup Node.js for Dependency Audit
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NPM Dependency Audit
        run: |
          npm audit --audit-level=critical || echo "Audit completed with advisory warnings."
